<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Modern Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="calculator">
        <div class="display" id="display">0</div>

        <button id="toggle-scientific">Show Scientific Keys</button>

        <div class="keypad">
            <div class="keys">
                <button class="key clear" data-value="C">C</button>
                <button class="key operator" data-value="(">(</button>
                <button class="key operator" data-value=")">)</button>
                <button class="key operator" data-value="/">÷</button>

                <button class="key" data-value="7">7</button>
                <button class="key" data-value="8">8</button>
                <button class="key" data-value="9">9</button>
                <button class="key operator" data-value="*">×</button>

                <button class="key" data-value="4">4</button>
                <button class="key" data-value="5">5</button>
                <button class="key" data-value="6">6</button>
                <button class="key operator" data-value="-">-</button>

                <button class="key" data-value="1">1</button>
                <button class="key" data-value="2">2</button>
                <button class="key" data-value="3">3</button>
                <button class="key operator" data-value="+">+</button>

                <button class="key" data-value="0">0</button>
                <button class="key" data-value=".">.</button>
                <button class="key equals" data-value="=">=</button>
            </div>

            <div class="scientific-keys hidden" id="scientific-keys">
                <button class="scientific" data-value="sin(">sin</button>
                <button class="scientific" data-value="cos(">cos</button>
                <button class="scientific" data-value="tan(">tan</button>
                <button class="scientific" data-value="log(">log</button>
                <button class="scientific" data-value="sqrt(">√</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>

    <script type="module" src="script.js"></script>
</body>

</html>
